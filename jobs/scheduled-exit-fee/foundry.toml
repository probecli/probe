[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../../contracts/lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Sandbox: no shell access, no filesystem access, no env reads from cases.
ffi = false
fs_permissions = []
# Pinned snapshot: every case runs at this exact block and time.
block_number = 4812330
block_timestamp = 1767225600
remappings = [
  "forge-std/=../../contracts/lib/forge-std/src/",
  "v4-core/=../../contracts/lib/v4-core/",
  "solmate/=../../contracts/lib/v4-core/lib/solmate/",
  "@openzeppelin/=../../contracts/lib/v4-core/lib/openzeppelin-contracts/",
]
