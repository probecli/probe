name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge test -vv
        working-directory: contracts

  protocol:
    name: protocol (typecheck, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci
        working-directory: protocol
      - run: npm run typecheck
        working-directory: protocol
      - run: npm test
        working-directory: protocol
      - name: Pack and install the CLI as npm users get it
        working-directory: protocol
        run: |
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/probecli-cli-*.tgz
          cd "$RUNNER_TEMP"
          probe --version
          probe help > /dev/null
          probe check 0x0af57f62982d03066ef917acad87f771c06528ec --json > /dev/null
